version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_shorturl
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: shorturl_db
      POSTGRES_USER: shorturl_user
      POSTGRES_PASSWORD: shorturl_password

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shorturl_app
    depends_on:
      - postgres
    env_file:
    - .env
    environment:
      - PORT
      - JWT_SECRET
      - DATABASE_DSN
    ports:
      - "8080:8080"
    command: ./app

volumes:
  postgresql_data: